<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome TPU — карточки</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
    <div class="header-inner">
      <img src="images/logo.png" alt="" class="logo-img">
      <a href="index.html" class="logo-text">Welcome TPU</a>
    </div>
  </header>

  <main class="cards-page">
    <div class="cards-top">
      <a href="index.html">← Назад</a>
      <span>1 из 10</span>
    </div>

    <article class="card">
      <span class="badge">Факт</span>
      <div class="placeholder card-media">картинка или видео</div>
      <h2>Заголовок карточки</h2>
      <p>
        Тестовый текст карточки. Здесь будет информационная часть факта, истории,
        мероприятия или статистики о ТПУ.
      </p>
    </article>

    <div class="cards-controls">
      <a href="#" class="arrow">←</a>
      <span class="hint">Листайте карточки свайпом или стрелками</span>
      <a href="finish.html" class="arrow">→</a>
    </div>
  </main>
</body>
</html>
