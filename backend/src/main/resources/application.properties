spring.application.name=welcomtpu-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/welcomtpu
spring.datasource.username=welcomtpu
spring.datasource.password=welcomtpu
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.docker.compose.enabled=true
spring.docker.compose.file=compose.yaml
spring.docker.compose.lifecycle-management=start-and-stop

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
