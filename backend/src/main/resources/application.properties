spring.application.name=welcomtpu-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/welcomtpu
spring.datasource.username=welcomtpu
spring.datasource.password=welcomtpu
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Загрузка изображений (лимит спецификации - 10 МБ)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# на существующих dev-базах создаёт baseline вместо падения
spring.flyway.baseline-on-migrate=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.docker.compose.enabled=true
spring.docker.compose.file=compose.yaml
spring.docker.compose.lifecycle-management=start-and-stop

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# ---- Единая авторизация ТПУ (oauth.tpu.ru) ----
# Секреты (client-id/secret, JWT-ключ) лежат в ../.secret/backend-oauth.properties (вне репозитория).
# redirect-uri должен быть в доверенных redirect uri приложения в дашборде api.tpu.ru.
# Для локальной разработки добавь http://localhost:8080 в доверенные.
spring.config.import=optional:file:../.secret/backend-oauth.properties

oauth.tpu.authorize-url=https://oauth.tpu.ru/authorize
oauth.tpu.access-token-url=https://oauth.tpu.ru/access_token
oauth.tpu.check-token-url=https://oauth.tpu.ru/check-token
# Куда редиректить после успешного входа (админка фронта)
auth.success-redirect=${OAUTH_SUCCESS_REDIRECT:http://localhost:3000/admin}
# Secure-флаг cookie: на проде за HTTPS должен быть true
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
# JWT сессии админа (HS256), срок 1 час
auth.jwt.ttl-seconds=3600
# user_id администраторов приложения через запятую
auth.admin-user-ids=${AUTH_ADMIN_USER_IDS:}
