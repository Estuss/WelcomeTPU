services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: welcomtpu-postgres
    environment:
      POSTGRES_DB: welcomtpu
      POSTGRES_USER: welcomtpu
      POSTGRES_PASSWORD: welcomtpu
    ports:
      - "5432:5432"
    volumes:
      - welcomtpu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U welcomtpu -d welcomtpu"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  welcomtpu_pgdata:
